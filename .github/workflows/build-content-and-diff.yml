name: Build Content and Diff

on:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - ".github/workflows/build-content-and-diff.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {} # No GITHUB_TOKEN permissions, as we only use it to increase API limit.

env:
  BUILD_BASE: ${{ github.workspace }}/build-base
  BUILD_PR: ${{ github.workspace }}/build-pr
  CONTENT_ROOT: ${{ github.workspace }}/content/files
  DIFF: ${{ github.workspace }}/diff.html
  STATS: ${{ github.workspace }}/diff-stats.json
  PERF: ${{ github.workspace }}/perf-stats.json
  CARGO_TERM_COLOR: always
  # Measure the target the npm package ships, as its allocator behaves differently from glibc's.
  RARI_TARGET: x86_64-unknown-linux-musl
  RARI_BIN: target/x86_64-unknown-linux-musl/release/rari

jobs:
  build-and-diff:
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"

    steps:
      - name: Checkout (content)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mdn/content
          path: content
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Checkout (rari @ base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: rari-base
          persist-credentials: false

      - name: Checkout previous release (release-please PR)
        if: startsWith(github.head_ref, 'release-please--')
        working-directory: rari-base
        run: |
          PREV_VERSION=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')
          if [[ -n "$PREV_VERSION" ]]; then
            echo "Building release-please PR against previous release: v$PREV_VERSION"
            git fetch origin tag "v$PREV_VERSION" --no-tags
            git checkout "v$PREV_VERSION"
          fi

      - name: Checkout (rari @ PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rari-pr
          persist-credentials: false

      # Compile separately so the builds below can double as warm-up runs for the timed ones.
      - name: Compile base
        working-directory: rari-base
        # Inside the checkout, so the target is added to the `rust-toolchain.toml` toolchain.
        run: |
          rustup target add "$RARI_TARGET"
          cargo build --locked --release --target "$RARI_TARGET"

      - name: Compile PR
        working-directory: rari-pr
        run: |
          rustup target add "$RARI_TARGET"
          cargo build --locked --release --target "$RARI_TARGET"

      - name: Build with base
        working-directory: rari-base
        env:
          BUILD_OUT_ROOT: ${{ env.BUILD_BASE }}
          DEPS_DATA_DIR: ${{ github.workspace }}/deps-base
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./"$RARI_BIN" build --json-issues

      - name: Build with PR
        working-directory: rari-pr
        env:
          BUILD_OUT_ROOT: ${{ env.BUILD_PR }}
          DEPS_DATA_DIR: ${{ github.workspace }}/deps-pr
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./"$RARI_BIN" build --json-issues

      - name: Generate diff
        working-directory: rari-pr
        run: |
          cargo run --locked --quiet -p diff-test diff --fast --flaws --html --value --search-index \
            --out "$DIFF" --stats-out "$STATS" "$BUILD_BASE" "$BUILD_PR"

      - name: Summarize diff
        run: |
          {
            echo "## Build diff"
            echo
            jq -r '"**\(.changed_files)** of \(.total_files) pages changed (\(.changes) changes)"' "$STATS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-diff-report
          path: ${{ env.DIFF }}
          if-no-files-found: error

      # A failure here must not lose the diff stats, which the companion workflow needs.
      - name: Measure build performance
        continue-on-error: true
        working-directory: rari-pr
        run: |
          cargo run --locked --quiet -p diff-test perf --rounds 3 \
            --base-dir "$GITHUB_WORKSPACE/rari-base" --base-deps "$GITHUB_WORKSPACE/deps-base" \
            --pr-dir "$GITHUB_WORKSPACE/rari-pr" --pr-deps "$GITHUB_WORKSPACE/deps-pr" \
            --rari-bin "$RARI_BIN" --scratch "$RUNNER_TEMP/perf" \
            --out "$PERF" --summary "$GITHUB_STEP_SUMMARY"

      # Both files land at the artifact root, as they share the workspace as common ancestor.
      - name: Upload diff stats
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-diff-stats
          path: |
            ${{ env.STATS }}
            ${{ env.PERF }}
          if-no-files-found: error
