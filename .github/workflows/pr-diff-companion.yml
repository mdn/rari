name: PR Diff Companion

on:
  workflow_run:
    workflows: ["Build Content and Diff"]
    types: [completed]

permissions: {}

jobs:
  identify-pr:
    if: |
      github.repository_owner == 'mdn' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      number: ${{ steps.identify-pr.outputs.number }}
    steps:
      - name: Identify PR
        id: identify-pr
        env:
          BASE_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Fork PRs control the artifact, so trust only the event payload and the API.
          # Query the head repo: for fork PRs, the base repo returns no PRs for the commit.
          # Filter on head.sha: the endpoint also lists PRs that merely contain the commit.
          PR_NUMBER=$(gh api "repos/$HEAD_REPO/commits/$HEAD_SHA/pulls" \
            --jq 'first(.[] | select(.base.repo.full_name == env.BASE_REPO and .head.sha == env.HEAD_SHA and .state == "open") | .number)')
          if [[ -z "$PR_NUMBER" ]]; then
            echo "::notice::No open PR with head $HEAD_SHA; nothing to do."
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

  label:
    needs: identify-pr
    if: needs.identify-pr.outputs.number != ''
    runs-on: ubuntu-latest
    permissions:
      # Download artifact of the triggering run and update pull request labels.
      actions: read
      pull-requests: write
    concurrency:
      group: ${{ github.workflow }}-${{ needs.identify-pr.outputs.number }}
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.label.outputs.changed }}
      total: ${{ steps.label.outputs.total }}
      changes: ${{ steps.label.outputs.changes }}
      percentage: ${{ steps.label.outputs.percentage }}
      report-url: ${{ steps.label.outputs.report-url }}
      current: ${{ steps.label.outputs.current }}
    steps:
      - name: Download diff stats
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-diff-stats
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Label PR
        id: label
        env:
          PR: ${{ needs.identify-pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::Invalid PR number: $PR"; exit 1; }

          read -r CHANGED TOTAL CHANGES <<<"$(jq -r '
            [.changed_files, .total_files, .changes]
            | map(numbers | floor) | select(length == 3) | @tsv' diff-stats.json)"
          [[ "$CHANGED" =~ ^[0-9]{1,9}$ && "$TOTAL" =~ ^[0-9]{1,9}$ && "$CHANGES" =~ ^[0-9]{1,9}$ ]] || { echo "::error::Invalid diff-stats.json"; exit 1; }

          PERCENTAGE=$(awk -v c="$CHANGED" -v t="$TOTAL" 'BEGIN { printf "%.1f", (t > 0 ? c / t * 100 : 0) }')
          {
            echo "changed=$CHANGED"
            echo "total=$TOTAL"
            echo "changes=$CHANGES"
            echo "percentage=$PERCENTAGE"
          } >> "$GITHUB_OUTPUT"

          ARTIFACT_ID=$(gh api "/repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "build-diff-report") | .id')
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || { echo "::error::No build-diff-report artifact in run $RUN_ID"; exit 1; }
          echo "report-url=https://github.com/$GH_REPO/actions/runs/$RUN_ID/artifacts/$ARTIFACT_ID" >> "$GITHUB_OUTPUT"

          if (( CHANGED == 0 )); then
            LABEL="diff: none"
          elif (( CHANGED <= 10 )); then
            LABEL="diff: 1-10 pages"
          elif (( CHANGED <= 100 )); then
            LABEL="diff: 11-100 pages"
          elif (( CHANGED <= 1000 )); then
            LABEL="diff: 101-1000 pages"
          else
            LABEL="diff: 1000+ pages"
          fi
          export LABEL

          STALE=$(gh pr view "$PR" --json labels \
            --jq '[.labels[].name | select(startswith("diff: ") and . != env.LABEL)] | join(",")')

          CURRENT_HEAD=$(gh api "/repos/$GH_REPO/pulls/$PR" \
            --jq 'select(.state == "open") | .head.sha')
          if [[ "$CURRENT_HEAD" != "$HEAD_SHA" ]]; then
            echo "::notice::PR #$PR is closed or has a newer head; nothing to do."
            exit 0
          fi

          echo "current=true" >> "$GITHUB_OUTPUT"
          gh pr edit "$PR" --add-label "$LABEL" ${STALE:+--remove-label "$STALE"}

  deploy-diff:
    needs: [identify-pr, label]
    if: needs.label.outputs.current == 'true' && needs.label.outputs.changed != '0'
    permissions:
      contents: read
      id-token: write
      actions: read
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      prefix: rari-pr${{ needs.identify-pr.outputs.number }}
      build-artifact-name: build-diff-report
      build-workflow-run-id: ${{ github.event.workflow_run.id }}

  comment:
    needs: [identify-pr, label, deploy-diff]
    if: >-
      always() &&
      needs.identify-pr.outputs.number != '' &&
      needs.label.result == 'success' &&
      (needs.deploy-diff.result == 'success' || needs.deploy-diff.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    concurrency:
      group: ${{ github.workflow }}-${{ needs.identify-pr.outputs.number }}
      cancel-in-progress: false
    steps:
      - name: Comment in PR
        env:
          PR: ${{ needs.identify-pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_REPO: ${{ github.repository }}
          REPORT_URL: ${{ needs.label.outputs.report-url }}
          REVIEW_URL: ${{ needs.deploy-diff.outputs.url }}
          CHANGED: ${{ needs.label.outputs.changed }}
          TOTAL: ${{ needs.label.outputs.total }}
          CHANGES: ${{ needs.label.outputs.changes }}
          PERCENTAGE: ${{ needs.label.outputs.percentage }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          CURRENT_HEAD=$(gh api "/repos/$GH_REPO/pulls/$PR" \
            --jq 'select(.state == "open") | .head.sha')
          if [[ "$CURRENT_HEAD" != "$HEAD_SHA" ]]; then
            echo "::notice::PR #$PR is closed or has a newer head; nothing to do."
            exit 0
          fi

          export MARKER='<!-- rari-build-diff -->'
          COMMENT_ID=$(gh api --paginate --slurp "/repos/$GH_REPO/issues/$PR/comments" \
            | jq -r 'first(.[][] | select(.user.login == "github-actions[bot]" and (.body | contains(env.MARKER))) | .id) // empty')

          if (( CHANGED > 0 )); then
            if [[ -n "$REVIEW_URL" ]]; then
              printf -v BODY '%s\n**Build diff:** %s changes in %s of %s pages (%s%%)\n\n[View report](%sdiff.html) | [Download report](%s)' \
                "$MARKER" "$CHANGES" "$CHANGED" "$TOTAL" "$PERCENTAGE" "$REVIEW_URL" "$REPORT_URL"
            else
              printf -v BODY '%s\n**Build diff:** %s changes in %s of %s pages (%s%%)\n\n[Download report](%s)' \
                "$MARKER" "$CHANGES" "$CHANGED" "$TOTAL" "$PERCENTAGE" "$REPORT_URL"
            fi
            if [[ -n "$COMMENT_ID" ]]; then
              gh api -X PATCH "/repos/$GH_REPO/issues/comments/$COMMENT_ID" -f body="$BODY" > /dev/null
            else
              gh api -X POST "/repos/$GH_REPO/issues/$PR/comments" -f body="$BODY" > /dev/null
            fi
          elif [[ -n "$COMMENT_ID" ]]; then
            printf -v BODY '%s\n**Build diff:** No pages changed.' "$MARKER"
            gh api -X PATCH "/repos/$GH_REPO/issues/comments/$COMMENT_ID" -f body="$BODY" > /dev/null
          fi
