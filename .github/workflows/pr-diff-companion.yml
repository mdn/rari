name: PR Diff Companion

on:
  workflow_run:
    workflows: ["Build Content and Diff"]
    types: [completed]

permissions: {}

jobs:
  identify-pr:
    if: |
      github.repository_owner == 'mdn' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      number: ${{ steps.identify-pr.outputs.number }}
    steps:
      - name: Identify PR
        id: identify-pr
        env:
          BASE_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Fork PRs control the artifact, so trust only the event payload and the API.
          # Query the head repo: for fork PRs, the base repo returns no PRs for the commit.
          # Filter on head.sha: the endpoint also lists PRs that merely contain the commit.
          PR_NUMBER=$(gh api "repos/$HEAD_REPO/commits/$HEAD_SHA/pulls" \
            --jq 'first(.[] | select(.base.repo.full_name == env.BASE_REPO and .head.sha == env.HEAD_SHA and .state == "open") | .number)')
          if [[ -z "$PR_NUMBER" ]]; then
            echo "::notice::No open PR with head $HEAD_SHA; nothing to do."
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

  label:
    needs: identify-pr
    if: needs.identify-pr.outputs.number != ''
    runs-on: ubuntu-latest
    permissions:
      # Download artifact of the triggering run.
      actions: read
      # Label and comment on the pull request.
      pull-requests: write
    concurrency:
      group: ${{ github.workflow }}-${{ needs.identify-pr.outputs.number }}
      cancel-in-progress: false
    steps:
      - name: Download diff stats
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-diff-stats
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # perf-stats.json is untrusted: accept only bounded numbers, recompute the deltas and
      # significance, and output nothing but text built from validated numbers.
      - name: Evaluate build performance
        id: perf
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("node:fs");

            const seconds = (v) => `${v.toFixed(2)}s`;
            const METRICS = [
              { key: "wall_seconds", name: "Wall time", format: seconds },
              { key: "cpu_seconds", name: "CPU time (user + sys)", format: seconds },
              { key: "max_rss_bytes", name: "Peak RSS", format: (v) => `${(v / 1024 ** 2).toFixed(2)} MiB` },
            ];
            const isNum = (v) => typeof v === "number" && Number.isFinite(v) && v >= 0 && v <= 1e12;
            const isStat = (s) =>
              s !== null && typeof s === "object" &&
              [s.median, s.min, s.max].every(isNum) && s.min <= s.median && s.median <= s.max;

            let stats;
            try {
              stats = JSON.parse(fs.readFileSync("perf-stats.json", "utf8"));
            } catch {
              core.notice("No readable perf-stats.json in the artifact; skipping performance report.");
              return;
            }
            const valid =
              stats !== null && typeof stats === "object" &&
              Number.isInteger(stats.rounds) && stats.rounds >= 1 && stats.rounds <= 100 &&
              METRICS.every(({ key }) => isStat(stats[key]?.base) && isStat(stats[key]?.pr));
            if (!valid) {
              core.warning("Invalid perf-stats.json; skipping performance report.");
              return;
            }

            // Significant: median delta >= 5% and the base and PR ranges do not overlap.
            const rows = METRICS.map(({ key, name, format }) => {
              const { base, pr } = stats[key];
              const delta = base.median > 0 ? ((pr.median - base.median) / base.median) * 100 : 0;
              const verdict =
                delta >= 5 && pr.min > base.max ? "regression"
                : delta <= -5 && pr.max < base.min ? "improvement"
                : null;
              const text = `${delta >= 0 ? "+" : ""}${delta.toFixed(1)}%`;
              return {
                verdict,
                line: `| ${name} | ${format(base.median)} | ${format(pr.median)} | ${verdict ? `**${text}**` : text} |`,
              };
            });
            const verdict = ["regression", "improvement"].find((v) => rows.some((row) => row.verdict === v));

            core.setOutput("ok", "1");
            if (verdict) {
              core.setOutput("label", `perf: ${verdict}`);
              core.setOutput("section", [
                `**Build performance:** ${verdict} (medians of ${stats.rounds} interleaved runs per side on a shared CI runner, so treat small changes with care)`,
                "",
                "| Metric | Base | PR | Delta |",
                "| --- | ---: | ---: | ---: |",
                ...rows.map((row) => row.line),
              ].join("\n"));
            }

      - name: Label PR and comment
        env:
          PERF_OK: ${{ steps.perf.outputs.ok }}
          PERF_LABEL: ${{ steps.perf.outputs.label }}
          PERF_SECTION: ${{ steps.perf.outputs.section }}
          PR: ${{ needs.identify-pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::Invalid PR number: $PR"; exit 1; }

          ARTIFACT_ID=$(gh api "/repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "build-diff-report") | .id')
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || { echo "::error::No build-diff-report artifact in run $RUN_ID"; exit 1; }

          read -r CHANGED TOTAL CHANGES <<<"$(jq -r '
            [.changed_files, .total_files, .changes]
            | map(numbers | floor) | select(length == 3) | @tsv' diff-stats.json)"
          [[ "$CHANGED" =~ ^[0-9]{1,9}$ && "$TOTAL" =~ ^[0-9]{1,9}$ && "$CHANGES" =~ ^[0-9]{1,9}$ ]] || { echo "::error::Invalid diff-stats.json"; exit 1; }

          if (( CHANGED == 0 )); then
            LABEL="diff: none"
          elif (( CHANGED <= 10 )); then
            LABEL="diff: 1-10 pages"
          elif (( CHANGED <= 100 )); then
            LABEL="diff: 11-100 pages"
          elif (( CHANGED <= 1000 )); then
            LABEL="diff: 101-1000 pages"
          else
            LABEL="diff: 1000+ pages"
          fi
          export LABEL

          STALE=$(gh pr view "$PR" --json labels \
            --jq '[.labels[].name | select((startswith("diff: ") and . != env.LABEL) or (env.PERF_OK == "1" and startswith("perf: ") and . != env.PERF_LABEL))] | join(",")')

          export MARKER='<!-- rari-build-diff -->'
          COMMENT_ID=$(gh api --paginate --slurp "/repos/$GH_REPO/issues/$PR/comments" \
            | jq -r 'first(.[][] | select(.user.login == "github-actions[bot]" and (.body | contains(env.MARKER))) | .id) // empty')

          CURRENT_HEAD=$(gh api "/repos/$GH_REPO/pulls/$PR" \
            --jq 'select(.state == "open") | .head.sha')
          if [[ "$CURRENT_HEAD" != "$HEAD_SHA" ]]; then
            echo "::notice::PR #$PR is closed or has a newer head; nothing to do."
            exit 0
          fi

          gh pr edit "$PR" --add-label "$LABEL" ${PERF_LABEL:+--add-label "$PERF_LABEL"} ${STALE:+--remove-label "$STALE"}

          if (( CHANGED > 0 || ${#PERF_SECTION} > 0 )); then
            if (( CHANGED > 0 )); then
              PERCENTAGE=$(awk -v c="$CHANGED" -v t="$TOTAL" 'BEGIN { printf "%.1f", (t > 0 ? c / t * 100 : 0) }')
              printf -v BODY '%s\n**Build diff:** %s changes in %s of %s pages (%s%%)\n\n[Download report](%s) (`diff.html`)' \
                "$MARKER" "$CHANGES" "$CHANGED" "$TOTAL" "$PERCENTAGE" \
                "https://github.com/$GH_REPO/actions/runs/$RUN_ID/artifacts/$ARTIFACT_ID"
            else
              printf -v BODY '%s\n**Build diff:** No pages changed.' "$MARKER"
            fi
            [[ -z "$PERF_SECTION" ]] || BODY+=$'\n\n'"$PERF_SECTION"
            if [[ -n "$COMMENT_ID" ]]; then
              gh api -X PATCH "/repos/$GH_REPO/issues/comments/$COMMENT_ID" -f body="$BODY" > /dev/null
            else
              gh api -X POST "/repos/$GH_REPO/issues/$PR/comments" -f body="$BODY" > /dev/null
            fi
          elif [[ -n "$COMMENT_ID" ]]; then
            printf -v BODY '%s\n**Build diff:** No pages changed.' "$MARKER"
            gh api -X PATCH "/repos/$GH_REPO/issues/comments/$COMMENT_ID" -f body="$BODY" > /dev/null
          fi
