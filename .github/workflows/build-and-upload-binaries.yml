name: build-and-upload-binaries

permissions:
  contents: write

on:
  release:
    types: [created]

jobs:
  upload-assets:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: rari
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build-tool }}
          profile: release-lto

  publish-npm:
    needs: upload-assets
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # A separate run on the release tag keeps npm provenance tied to the release commit.
      - name: Dispatch npm publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          RUN_URL="$(gh api --method POST \
            "repos/{owner}/{repo}/actions/workflows/publish-npm.yml/dispatches" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -f ref="$RELEASE_TAG" \
            -F 'inputs[publish]=true' \
            --jq '.html_url')"
          echo "npm publishing run: $RUN_URL" >> "$GITHUB_STEP_SUMMARY"
