name: build-and-upload-binaries

permissions:
  contents: write

on:
  release:
    types: [created]

jobs:
  upload-assets:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: rari
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build-tool }}
          profile: release-lto

  publish-npm:
    needs: upload-assets
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # A separate run on the release tag keeps npm provenance tied to the release commit.
      - name: Dispatch npm publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh workflow run publish-npm.yml --ref "$RELEASE_TAG" -f publish=true
          # The dispatch returns before the run exists, so poll briefly for its URL.
          for _ in $(seq 1 6); do
            sleep 5
            RUN_URL="$(gh run list --workflow publish-npm.yml --branch "$RELEASE_TAG" --event workflow_dispatch -L 1 --json url --jq '.[0].url')"
            if [ -n "$RUN_URL" ]; then
              echo "npm publishing run: $RUN_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::warning::Could not find the dispatched publish-npm run"
