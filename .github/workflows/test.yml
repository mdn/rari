name: Test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions: {} # No GITHUB_TOKEN permissions, as we only use it to increase API limit.

env:
  CONTENT_ROOT: ${{ github.workspace }}/content/files
  CONTENT_TRANSLATED_ROOT: ${{ github.workspace }}/translated-content/files
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      rari-binary-artifact-id: ${{ steps.upload.outputs.artifact-id }}

    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97

      - name: sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Build
        run: cargo build --locked --release --verbose

      - name: Upload binary
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rari-binary
          path: target/release/rari
          retention-days: 1

  format:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97
        with:
          components: rustfmt

      - name: Run fmt
        run: cargo fmt -- --check

  test:
    needs: build
    runs-on: ubuntu-latest

    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97

      - name: sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Run tests
        run: cargo test --locked --verbose --workspace --all-targets --no-fail-fast

      - name: Run doc tests
        run: cargo test --locked --verbose --workspace --doc --no-fail-fast

  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Run tests with coverage
        run: cargo llvm-cov --locked --workspace --all-targets --no-fail-fast --no-report

      - name: Write summary
        run: |
          {
            echo "## Test coverage"
            echo
            echo '```'
            cargo llvm-cov report --workspace --summary-only | grep -E '^(Filename|TOTAL)'
            echo '```'
            echo
            echo "<details><summary>Per file</summary>"
            echo
            echo '```'
            cargo llvm-cov report --workspace --summary-only
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate HTML report
        run: cargo llvm-cov report --workspace --html

      - name: Upload HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: target/llvm-cov/html
          retention-days: 14

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97
        with:
          components: clippy

      - name: Run clippy
        run: cargo clippy --locked --all-features --workspace -- -Dwarnings

  content:
    if: github.event_name == 'pull_request'
    needs: build

    uses: ./.github/workflows/_test-content.yml
    with:
      rari-binary-artifact-id: ${{ needs.build.outputs.rari-binary-artifact-id }}

  pr-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    needs: build
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    secrets: inherit

    uses: ./.github/workflows/pr-review-companion.yml
    with:
      rari-binary-artifact-id: ${{ needs.build.outputs.rari-binary-artifact-id }}
