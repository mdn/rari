name: publish-npm

on:
  workflow_run:
    workflows: [build-and-upload-binaries]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.2.35)"
        required: true
        type: string
      publish:
        description: "Actually publish (otherwise dry run)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read # download release assets
  id-token: write # OIDC for npm Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: rari-npm/.nvmrc
          registry-url: "https://registry.npmjs.org/"
          package-manager-cache: false

      - name: Install
        working-directory: ./rari-npm
        run: npm install --ignore-scripts # skip the postinstall download, the binary comes from the release assets below

      - name: Download release assets
        working-directory: ./rari-npm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p 'require("./package.json").version')"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'rari-*' --dir assets

      - name: Prepare platform packages
        working-directory: ./rari-npm
        run: |
          npm run prepare-platform-packages
          npm run unpack-release-assets -- assets

      - name: Generate types
        working-directory: ./rari-npm
        run: |
          mkdir -p bin
          cp npm/linux-x64/bin/rari bin/rari
          npm run export-schema
          npm run generate-types

      # Platform packages first, as @mdn/rari will pin them as optionalDependencies.
      # Skips versions that are already published, so a re-run after a partial failure succeeds.
      - name: Publish
        working-directory: ./rari-npm
        run: |
          set -eo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            FLAGS="--dry-run"
          else
            FLAGS="--provenance"
          fi
          for dir in npm/*/ ./; do
            NAME="$(node -p "require('./$dir/package.json').name")"
            VERSION="$(node -p "require('./$dir/package.json').version")"
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "Skipping $NAME@$VERSION, already published"
              continue
            fi
            (cd "$dir" && npm publish --access public $FLAGS)
          done
