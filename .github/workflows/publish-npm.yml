name: publish-npm

on:
  workflow_run:
    workflows: [build-and-upload-binaries]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.2.35)"
        required: true
        type: string
      publish:
        description: "Actually publish (otherwise dry run)"
        required: true
        default: false
        type: boolean

permissions:
  id-token: write # OIDC for npm Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both refs are maintainer-controlled: workflow_run only follows the release workflow, and workflow_dispatch requires write access.
          ref: ${{ inputs.tag || github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: rari-npm/.nvmrc
          registry-url: "https://registry.npmjs.org/"
          package-manager-cache: false

      # The checked-out ref decides what gets published, so a mismatching tag would publish under a different version.
      - name: Check tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: ./rari-npm
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="v$(node -p 'require("./package.json").version')"
          if [ "$INPUT_TAG" != "$TAG" ]; then
            echo "::error::Tag $INPUT_TAG does not match package.json version $TAG"
            exit 1
          fi

      - name: Generate Schema
        working-directory: ./rari-npm
        run: npm install && npm run export-schema && npm run generate-types
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        working-directory: ./rari-npm
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public --provenance
          fi
