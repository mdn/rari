name: PR Review Companion

on:
  # Builds the review site for every PR, and deploys it for same-repo PRs.
  workflow_call:
    inputs:
      rari-binary-artifact-id:
        description: "ID of rari binary artifact"
        type: string
        required: true
  # Deploys the review site for fork and Dependabot PRs, whose Test runs lack secrets.
  workflow_run:
    workflows: ["Test"]
    types: [completed]

permissions: {}

jobs:
  build:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/_build.yml
    secrets: inherit
    with:
      partial: true
      rari-binary-artifact-id: ${{ inputs.rari-binary-artifact-id }}

  identify-pr:
    # Fork and Dependabot PRs only; same-repo PRs deploy inline from Test (see deploy).
    if: |
      github.event_name == 'workflow_run' &&
      github.repository_owner == 'mdn' &&
      github.event.workflow_run.event == 'pull_request' &&
      (
        github.event.workflow_run.head_repository.full_name != github.repository ||
        github.event.workflow_run.actor.login == 'dependabot[bot]'
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: read
    outputs:
      number: ${{ steps.identify-pr.outputs.number }}
    steps:
      - name: Identify PR
        id: identify-pr
        env:
          BASE_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # Upload is the review build's last step, so this ignores failures in other Test jobs.
          # Must match the artifact name in _build.yml.
          ARTIFACTS=$(gh api "repos/$BASE_REPO/actions/runs/$RUN_ID/artifacts?name=build-output" \
            --jq '[.artifacts[] | select(.expired | not)] | length')
          if (( ARTIFACTS == 0 )); then
            echo "::notice::Run $RUN_ID has no build-output artifact; nothing to do."
            exit 0
          fi

          # Fork PRs control the artifact, so trust only the event payload and the API.
          # Query the head repo: for fork PRs, the base repo returns no PRs for the commit.
          # Filter on head repo and SHA: the endpoint also lists PRs that merely contain the commit.
          PR_NUMBER=$(gh api "repos/$HEAD_REPO/commits/$HEAD_SHA/pulls" \
            --jq 'first(.[] | select(
              .base.repo.full_name == env.BASE_REPO and
              .head.repo.full_name == env.HEAD_REPO and
              .head.sha == env.HEAD_SHA and
              .state == "open"
            ) | .number)')
          if [[ -z "$PR_NUMBER" ]]; then
            echo "::notice::No open PR with head $HEAD_SHA; nothing to do."
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [build, identify-pr]
    # Same-repo PRs deploy inline; the complementary predicate in identify-pr routes the rest via workflow_run.
    if: |
      !cancelled() &&
      (
        (
          github.event_name == 'pull_request' &&
          github.repository_owner == 'mdn' &&
          github.secret_source == 'Actions' &&
          needs.build.result == 'success' &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        needs.identify-pr.outputs.number != ''
      )
    permissions:
      contents: read
      id-token: write
      actions: read
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      cancel-in-progress: true
      prefix: rari-pr${{ github.event.pull_request.number || needs.identify-pr.outputs.number }}
      build-artifact-name: build-output
      build-workflow-run-id: ${{ github.event.workflow_run.id || 0 }}

  comment:
    needs: [identify-pr, deploy]
    if: "!cancelled() && needs.deploy.outputs.url != ''"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment in PR
        run: |
          COMMENT_ID=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json comments \
            --jq ".comments | sort_by(.createdAt) | map(select(.author.login == \"github-actions\" and (.body | contains(\"<!-- rari-build-diff -->\") | not))) | .[0].id")
          if [ -n "$COMMENT_ID" ]; then
            gh api graphql -f query='
                mutation($id:ID!, $body:String!) {
                  updateIssueComment(input:{id:$id, body:$body}) {
                    issueComment {
                      id
                    }
                  }
                }' -f id="$COMMENT_ID" -f body="$BODY"
          else
            gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body "$BODY"
          fi
        env:
          BODY: "${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }} was deployed to: ${{ needs.deploy.outputs.url }}"
          PR_NUMBER: ${{ github.event.pull_request.number || needs.identify-pr.outputs.number }}
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
